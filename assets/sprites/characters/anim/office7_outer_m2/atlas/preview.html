<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Sprite Preview</title>
<style>
  body { font-family: -apple-system, sans-serif; background:#1c1c22; color:#eee;
         display:flex; flex-direction:column; align-items:center; gap:16px; padding:24px; }
  #stage { image-rendering: pixelated; background:
           repeating-conic-gradient(#333 0% 25%, #3c3c44 0% 50%) 0 0 / 24px 24px;
           border-radius:8px; max-height:55vh; max-width:90vw;
           height:auto; width:auto; }
  .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center; }
  button { background:#33333d; color:#eee; border:1px solid #555; border-radius:6px;
           padding:6px 14px; font-size:14px; cursor:pointer; }
  button.active { background:#6c5ce7; border-color:#6c5ce7; }
  label { font-size:13px; color:#aaa; }
  select { background:#33333d; color:#eee; border:1px solid #555; border-radius:5px; }
  #frameInfo { min-width:72px; text-align:center; font:12px ui-monospace, monospace; color:#aaa; }
</style>
</head>
<body>
<h3>H3 Sprite Atlas Preview</h3>
<div id="spec" style="font-size:12px;color:#9a9aa5"></div>
<canvas id="stage"></canvas>
<div class="row" id="moves"></div>
<div class="row">
  <button id="playPause">暂停</button>
  <button id="prev">◀ 上一帧</button>
  <span id="frameInfo">1 / 1</span>
  <button id="next">下一帧 ▶</button>
  <label>FPS <input id="fps" type="range" min="1" max="60" value="10">
  <span id="fpsv">10</span></label>
</div>
<div class="row">
  <label>检查背景 <select id="stageBg">
    <option value="checker">棋盘格</option><option value="dark">深色</option>
    <option value="light">浅色</option></select></label>
  <label><input id="showPivot" type="checkbox"> 显示 pivot</label>
  <label><input id="pingpong" type="checkbox" autocomplete="off"> 往返预览（默认关闭，仅循环动作）</label>
  <label><input id="repeatOnce" type="checkbox" checked autocomplete="off"> 重复预览一次性动作</label>
  <label style="color:#888">按数字键 1-9 切换；▸ 导出语义为单次，预览可重复查看</label>
</div>

const cv = document.getElementById("stage"), cx = cv.getContext("2d");
// internal resolution = cell size; CSS max-height/width scales it to fit
cv.width = META.meta.cell_w; cv.height = META.meta.cell_h;
const SPEC = META.meta.spec;
if (SPEC) document.getElementById("spec").textContent =
  `atlas ${SPEC.atlas_px[0]}x${SPEC.atlas_px[1]}px · cell ${SPEC.cell_px[0]}x${SPEC.cell_px[1]}px · ` +
  `${SPEC.total_frames} 帧 / ${Object.keys(SPEC.moves).length} 动作 · ${SPEC.file_kb}KB · 建议 ${SPEC.fps_suggest} FPS · ` +
  `质量档 ${SPEC.quality_profile || "unknown"} · 输出质检 ${META.meta.qc || "UNKNOWN"}`;
const NAMES = Object.keys(META.moves);
// default/rest state = first looping move (state-machine home)
const HOME = NAMES.find(n => META.moves[n].loop !== false) || NAMES[0];
let cur = HOME, moveStart = performance.now(), playing = true, heldIndex = 0;
const movesEl = document.getElementById("moves");
function setMove(name) {
  cur = name; moveStart = performance.now(); heldIndex = 0;
  [...movesEl.children].forEach((c, i) =>
    c.classList.toggle("active", NAMES[i] === name));
}
NAMES.forEach((name, i) => {
  const b = document.createElement("button");
  const os = META.moves[name].playback === "once" ? "▸" : "⟳";
  b.textContent = `${i + 1} ${name} ${os} ${META.moves[name].qc || ""}`;
  b.onclick = () => setMove(name);
  movesEl.appendChild(b);
});
setMove(HOME);
// state machine: number keys trigger moves, like wiring to input
document.addEventListener("keydown", (e) => {
  const i = +e.key - 1;
  if (i >= 0 && i < NAMES.length) setMove(NAMES[i]);
});
const fps = document.getElementById("fps"), fpsv = document.getElementById("fpsv");
const pingpong = document.getElementById("pingpong");
const repeatOnce = document.getElementById("repeatOnce");
const playPause = document.getElementById("playPause");
const prev = document.getElementById("prev"), next = document.getElementById("next");
const frameInfo = document.getElementById("frameInfo");
const stageBg = document.getElementById("stageBg");
const showPivot = document.getElementById("showPivot");
// Defeat browser form-state restoration: reverse playback must never turn on
// just because a previous preview had the checkbox selected.
pingpong.checked = false;
repeatOnce.checked = true;
fps.value = META.meta.fps_suggest || 10;
fpsv.textContent = fps.value;
function pauseAt(delta = 0) {
  const n = META.moves[cur].frames.length;
  if (playing) playing = false;
  heldIndex = (heldIndex + delta + n) % n;
  playPause.textContent = "播放";
}
playPause.onclick = () => {
  playing = !playing;
  playPause.textContent = playing ? "暂停" : "播放";
  if (playing) moveStart = performance.now() - heldIndex / +fps.value * 1000;
};
prev.onclick = () => pauseAt(-1);
next.onclick = () => pauseAt(1);
stageBg.onchange = () => {
  cv.style.background = stageBg.value === "dark" ? "#181a20" :
    stageBg.value === "light" ? "#f4f4f4" :
    "repeating-conic-gradient(#333 0% 25%, #3c3c44 0% 50%) 0 0 / 24px 24px";
};
function tick() {
  const mv = META.moves[cur];
  const frames = mv.frames;
  const n = frames.length;
  // wall-clock frame index — immune to tab throttling and frame drops
  const raw = Math.floor((performance.now() - moveStart) / 1000 * +fps.value);
  let idx = heldIndex;
  if (!playing) {
    idx = Math.min(heldIndex, n - 1);
  } else if (mv.loop === false) {
    // Preview can repeat a one-shot for inspection without changing the
    // exported playback="once" runtime contract.
    if (repeatOnce.checked) idx = raw % n;
    else {
      if (raw >= n && mv.end_behavior === "hold") idx = n - 1;
      else if (raw >= n) { setMove(HOME); return requestAnimationFrame(tick); }
      else idx = raw;
    }
  } else if (pingpong.checked && n > 1) {
    const cycle = 2 * n - 2;
    const p = raw % cycle;
    idx = p < n ? p : cycle - p;
  } else {
    idx = raw % n;
  }
  heldIndex = idx;
  const f = frames[idx];
  cx.clearRect(0, 0, cv.width, cv.height);
  cx.imageSmoothingEnabled = false;
  cx.drawImage(img, f.x, f.y, f.w, f.h, 0, 0, cv.width, cv.height);
  if (showPivot.checked && META.meta.pivot) {
    const px = META.meta.pivot.x * cv.width, py = META.meta.pivot.y * cv.height;
    cx.strokeStyle = "#ff4057"; cx.lineWidth = Math.max(1, cv.width / 256);
    cx.beginPath(); cx.moveTo(px - 8, py); cx.lineTo(px + 8, py);
    cx.moveTo(px, py - 8); cx.lineTo(px, py + 8); cx.stroke();
  }
  frameInfo.textContent = `${idx + 1} / ${n}`;
  requestAnimationFrame(tick);
}
fps.oninput = () => fpsv.textContent = fps.value;
pingpong.onchange = repeatOnce.onchange = () => moveStart = performance.now();
if (img.complete) requestAnimationFrame(tick); else img.onload = () => requestAnimationFrame(tick);
</script>
